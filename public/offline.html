<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — StreamGive</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --subtext: #4b5563;
      --card-bg: #f9fafb;
      --card-border: #e5e7eb;
      --btn-bg: #0d9488;
      --btn-hover: #0f766e;
      --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #030712;
        --text: #f9fafb;
        --subtext: #9ca3af;
        --card-bg: #111827;
        --card-border: #1f2937;
        --btn-bg: #14b8a6;
        --btn-hover: #0d9488;
        --btn-text: #030712;
      }
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .container {
      max-width: 440px;
      padding: 2.5rem 1.5rem;
      margin: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.25rem;
      color: var(--btn-bg);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--subtext);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.75rem;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--btn-text);
      background-color: var(--btn-bg);
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }
    button:hover {
      background-color: var(--btn-hover);
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-6.364 9 9 0 012.829-6.364m2.828 2.828a5 5 0 012.829 1.414m-5.657 5.657L3 3" />
    </svg>
    <h1>You are offline</h1>
    <p>Please check your internet connection. Once you are back online, reload the page to continue using StreamGive.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
